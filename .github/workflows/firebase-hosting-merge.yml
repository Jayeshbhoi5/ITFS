# Deploys to Firebase on every push to master
# Deploys: Hosting (built React app) + Firestore rules + Firestore indexes
# Does NOT deploy: Firebase Functions (manage separately)

name: Deploy to Firebase on merge

on:
  push:
    branches:
      - master

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repository
      - uses: actions/checkout@v4

      # 2. Set up Node.js
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      # 3. Install dependencies
      - run: npm ci

      # 4. Build the React/Vite app — if this fails, nothing is deployed
      - run: npm run build

      # 5. Write service account key to a temp file for firebase-tools
      - name: Write service account key
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_INNOVATIVE_TEACHING_FEED_2D77A }}' > /tmp/sa.json

      # 6. Deploy Hosting using the official Firebase action
      - name: Deploy Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_INNOVATIVE_TEACHING_FEED_2D77A }}
          channelId: live
          projectId: innovative-teaching-feed-2d77a

      # 7. Deploy Firestore rules + indexes using firebase-tools
      - name: Deploy Firestore rules and indexes
        run: |
          npm install -g firebase-tools
          GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json firebase deploy --only firestore --project innovative-teaching-feed-2d77a
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json

      # 8. Clean up service account key
      - name: Clean up key
        if: always()
        run: rm -f /tmp/sa.json
