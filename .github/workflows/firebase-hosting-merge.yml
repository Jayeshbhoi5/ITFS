# Deploys to Firebase on every push to master
# Deploys: Hosting + Firestore rules + Firestore indexes
# Does NOT deploy: Firebase Functions

name: Deploy to Firebase on merge

on:
  push:
    branches:
      - master

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_INNOVATIVE_TEACHING_FEED_2D77A }}
          channelId: live
          projectId: innovative-teaching-feed-2d77a

      - name: Deploy Firestore rules via REST API
        run: |
          # Get access token from service account
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_INNOVATIVE_TEACHING_FEED_2D77A }}' > /tmp/sa.json

          # Install gcloud auth helper
          pip install google-auth requests --quiet

          # Deploy rules using Firebase Rules REST API
          python3 << 'EOF'
          import json, requests, google.auth, google.auth.transport.requests
          from google.oauth2 import service_account

          PROJECT = "innovative-teaching-feed-2d77a"

          # Load service account
          creds = service_account.Credentials.from_service_account_file(
              "/tmp/sa.json",
              scopes=["https://www.googleapis.com/auth/cloud-platform"]
          )
          auth_req = google.auth.transport.requests.Request()
          creds.refresh(auth_req)
          token = creds.token

          headers = {
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json"
          }

          # Read rules file
          with open("firestore.rules", "r") as f:
              rules_content = f.read()

          # Create a new ruleset
          ruleset_body = {
              "source": {
                  "files": [{"content": rules_content, "name": "firestore.rules"}]
              }
          }

          r = requests.post(
              f"https://firebaserules.googleapis.com/v1/projects/{PROJECT}/rulesets",
              headers=headers,
              json=ruleset_body
          )
          r.raise_for_status()
          ruleset_name = r.json()["name"]
          print(f"Created ruleset: {ruleset_name}")

          # Update the release to point to new ruleset
          release_body = {
              "release": {
                  "name": f"projects/{PROJECT}/releases/cloud.firestore",
                  "rulesetName": ruleset_name
              }
          }

          r = requests.patch(
              f"https://firebaserules.googleapis.com/v1/projects/{PROJECT}/releases/cloud.firestore",
              headers=headers,
              json=release_body
          )
          r.raise_for_status()
          print("Firestore rules deployed successfully")

          # Deploy Firestore indexes via Firestore Admin REST API
          with open("firestore.indexes.json", "r") as f:
              indexes_data = json.load(f)

          indexes = indexes_data.get("indexes", [])
          field_overrides = indexes_data.get("fieldOverrides", [])

          if indexes or field_overrides:
              index_url = f"https://firestore.googleapis.com/v1/projects/{PROJECT}/databases/(default)/collectionGroups/-/indexes"

              for index in indexes:
                  r = requests.post(index_url, headers=headers, json=index)

                  if r.status_code not in [200, 409]:  # 409 = already exists
                      print(f"Warning: index creation returned {r.status_code}: {r.text}")
                  else:
                      print(f"Index deployed or already exists: {index}")

              print("Firestore indexes deployed successfully")
          else:
              print("No indexes to deploy (firestore.indexes.json is empty)")
          EOF

          rm -f /tmp/sa.json