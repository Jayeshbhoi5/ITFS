# Deploys to Firebase on every push to master
# Deploys: Hosting + Firestore rules + Firestore indexes
# Does NOT deploy: Firebase Functions
#
# REQUIRED: The service account in FIREBASE_SERVICE_ACCOUNT_INNOVATIVE_TEACHING_FEED_2D77A
# must have these IAM roles in Google Cloud Console:
#   - Firebase Hosting Admin (already set)
#   - Firebase Rules Admin
#   - Cloud Datastore Index Admin
#   - Service Usage Consumer

name: Deploy to Firebase on merge

on:
  push:
    branches:
      - master

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_INNOVATIVE_TEACHING_FEED_2D77A }}
          channelId: live
          projectId: innovative-teaching-feed-2d77a

      - name: Deploy Firestore rules and indexes
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_INNOVATIVE_TEACHING_FEED_2D77A }}' > /tmp/sa.json
          npm install -g firebase-tools
          GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json firebase deploy --only firestore --project innovative-teaching-feed-2d77a
          rm -f /tmp/sa.json
